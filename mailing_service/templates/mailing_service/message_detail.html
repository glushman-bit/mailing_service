{% extends 'base.html' %}

{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-6 fw-medium">Информация о сообщении</h1>
</div>

<div class="container">
    <div class="col">

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-borderless align-middle mb-5">
                    <tbody>
                        <tr>
                            <th class="text-secondary" style="width: 220px;">
                                Название:
                            </th>
                            <td>{{ message.title }}</td>
                        </tr>
                        <tr>
                            <th class="text-secondary">
                                Контент:
                            </th>
                            <td>
                                {{ message.content }}
                            </td>
                        </tr>
                        <tr>
                            <th class="text-secondary">
                                Дата создания
                            </th>
                            <td>
                                {{ message.created_at|date:"d.m.Y H:i" }}
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="btn">
                    <a class="btn btn-sm btn-outline-primary" href="{% url 'mailing_service:messages_list' %}">
                        <i class="bi bi-reply me-1"> Назад</i>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
