[tool.poetry]
name = "mailing-service"
version = "0.1.0"
description = "Сервис рассылки"
authors = ["Ivan Glushenkov <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.4"
python-dotenv = "^1.2.2"
pillow = "^12.2.0"
django-phonenumber-field = {extras = ["phonenumbers"], version = "^8.4.0"}
django-countries = "^8.2.0"
ipython = "^9.13.0"
redis = "^7.4.0"
django-apscheduler = "^0.7.0"
apscheduler = "^3.11.2"
gunicorn = "^26.1.0"
psycopg = {extras = ["binary"], version = "^3.3.4"}


[tool.poetry.group.lint.dependencies]
isort = "^8.0.1"
black = "^26.5.1"
flake8 = "^7.3.0"
mypy = "^2.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# максимальная длина строки
profile = "black"
line_length = 119
skip = [".venv", "venv"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = "venv/|.venv/|build/|dist/|.mypy_cache/"
